<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIP Guide and Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* VOICE: calm, practical staff tool; Kalyan brand.
   IDEA: the SHIP client file, tab by tab, as a binder with coloured dividers.
   PICTURE: the working guide itself; each step a coloured divider.
   COLOUR and TYPE: Kalyan rust header, cream ground, six priority colours; Source Serif titles, Inter body.
   LAYOUT: header with search and mode switch; step list left; one step at a time right. */
:root{color-scheme:light dark;--bg:light-dark(#FAF5ED,#1d1512);--card:light-dark(#FFFDF9,#2a1f1a);--sub:light-dark(#F4ECDF,#33261f);--ink:light-dark(#2B1D17,#f3e9df);--muted:light-dark(#5A4A42,#c9b8ab);--line:light-dark(#E6D8C6,#4a3a30);--rust:#7D210A;--tan:#C49668}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
header{background:#74200A;color:#FFFDF9;border-bottom:4px solid var(--tan)}
.hin{max-width:1240px;margin:0 auto;padding:18px max(4vw,16px);display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.brand{display:flex;align-items:center;gap:18px;flex:1 1 360px}
.brand img{height:58px;width:auto}
.brand .sep{width:2px;align-self:stretch;background:var(--tan)}
.brand h1{font-size:clamp(26px,3vw,36px);line-height:1.05;font-weight:600}
.brand p{margin:2px 0 0;font-size:14px;color:#F5E6D6}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1 1 420px;justify-content:flex-end}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;height:46px;border-radius:10px;border:2px solid transparent;background:#FFFDF9;color:#2B1D17;padding:0 14px 0 40px;font-size:16px}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;stroke:#7D210A}
.mode{display:flex;background:#5A1504;border-radius:10px;padding:4px}
.mode button{height:40px;padding:0 16px;border:0;border-radius:7px;background:transparent;color:#F5E6D6;font-weight:600;cursor:pointer}
.mode button[aria-pressed=true]{background:#FFFDF9;color:#7D210A}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 48px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
nav{display:flex;flex-direction:column;gap:6px}
nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-radius:10px;text-decoration:none;color:var(--ink);border:1px solid transparent}
nav a:hover{background:var(--card)}
nav a[aria-current=true]{background:var(--card);border-color:var(--line);box-shadow:0 1px 3px rgba(90,21,4,.12)}
.chip{width:32px;height:32px;border-radius:16px;color:#fff;display:grid;place-items:center;font:700 15px 'Source Serif 4',Georgia,serif;flex:none}
nav .t{flex:1;font-weight:600;font-size:15px;line-height:1.25}
nav .c{font-size:13px;color:var(--muted);white-space:nowrap}
.rules{margin-top:14px;background:var(--rust);color:#FBEFE3;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.45}
.rules summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}.rules summary::-webkit-details-marker{display:none}.rules summary::after{content:"–";font-size:22px;color:#F2D3A8}.rules:not([open]) summary::after{content:"+"}
.rules h2{font-size:19px;color:#fff}.rules[open] summary{margin-bottom:8px}
.rules p{margin:0 0 8px}.rules b{color:#F2D3A8}
main{display:flex;flex-direction:column;gap:18px}
.step{background:var(--card);border-radius:14px;border-top:8px solid var(--c);box-shadow:0 1px 4px rgba(90,21,4,.12);padding:clamp(18px,3vw,30px)}
.sh{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.sh .chip{width:52px;height:52px;border-radius:26px;font-size:24px;background:var(--c)}
.sh h2{font-size:clamp(26px,3vw,36px);line-height:1.08}
.where{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin-top:4px}
:root[data-theme=dark] .where,:root:not([data-theme=light]) .where{color:light-dark(var(--c),#F2D3A8)}
.prog{height:8px;background:var(--sub);border-radius:4px;overflow:hidden;margin:-4px 0 16px}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.sub{background:var(--sub);border-radius:10px;padding:14px 16px}
.sub.key{outline:2px solid var(--c)}
.tag{display:inline-block;background:var(--c);color:#fff;font-weight:700;font-size:14px;border-radius:6px;padding:3px 10px;margin-bottom:8px}
ul.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.items li{position:relative;padding-left:20px}
ul.items li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--c)}
.check ul.items li{padding-left:0}.check ul.items li::before{display:none}
label.ck{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 8px;border-radius:8px;min-height:44px}
label.ck:hover{background:var(--line)}
label.ck input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--c);flex:none}
label.ck input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--tan)}
.p{margin:0 0 14px}.note{margin:12px 0 0;color:var(--muted);font-style:italic;font-size:15px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.btn.primary{background:var(--rust);color:#fff;border-color:var(--rust)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:14px 18px;border:1px solid var(--line)}
.bar .total{font-weight:600}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap}.confirm.on{display:flex}
mark{background:#F2D3A8;color:#2B1D17;border-radius:3px;padding:0 2px}
.res{display:flex;flex-direction:column;gap:10px}
.hit{display:block;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px 16px;cursor:pointer}
.hit small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-bottom:2px}
.empty{background:var(--card);border-radius:12px;padding:24px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none;overflow:visible}nav{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}nav a{flex:none}nav .t{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

const STEPS=[{"id": "step-1", "num": "1", "title": "Search first", "where": "Persons › Search tab", "color": "#7D210A", "blocks": [{"t": "list", "items": ["Search by <b>Given name</b> or <b>Family name</b> first. Keep <b>Fuzzy</b> ticked so close spellings are found.", "Use <b>%</b> or <b>*</b> as wildcards: <b>Wil%</b> finds Wilson, <b>%ke</b> finds Burke.", "Too many results? Add more letters. You can also search by <b>Alpha code</b>.", "Only click <b>Add new Client</b> if there is no match. Person records <b>can’t be deleted</b> (a Coordinator can merge duplicates)."]}]}, {"id": "step-2", "num": "2", "title": "Add the new client", "where": "Add new Client › Add new person", "color": "#7D210A", "blocks": [{"t": "list", "items": ["<b>Given name</b>, <b>Middle name</b>, <b>Family name</b>", "<b>Sex*</b> and <b>Date of birth</b> (if unsure, enter a best guess and tick <b>year estimated</b>)", "<b>Identifies as</b>: Aboriginal / Torres Strait Islander / Both / Neither", "<b>Country of birth</b> and <b>Year of arrival</b> (only shows if born overseas)", "<b>Language at home</b> and <b>Other languages spoken</b>: pick from the list, don’t type", "<b>CALD</b> (Culturally and Linguistically Diverse): ticks itself if born in a non-English-speaking country or speaks another language at home. Check it and change it if wrong.", "<b>CRN</b> (Centrelink Customer Reference Number), if the client has one", "<b>Comments</b>, if needed", "Click <b>Save</b>. The <b>Alpha code</b> is created automatically and the <b>Details</b> tab opens."]}]}, {"id": "step-3", "num": "3", "title": "Complete the Details tab", "where": "Persons › Details tab", "color": "#87422A", "blocks": [{"t": "sub", "name": "Person / Alias", "items": ["Other names (maiden name, nickname): <b>Create new alias</b>", "Enter <b>Given name</b>, <b>Family name</b>, <b>Sex*</b> (all used in searches)", "Add a <b>Comment</b> such as “Maiden name” or “Nickname”"], "note": null, "key": false}, {"t": "sub", "name": "Relationships (optional)", "items": ["<b>Create new relationship</b> › search for the person › <b>GO</b>", "Found? Click their name. Not found? Click <b>Add new person</b>", "Always record their <b>Sex</b>, so SHIP can work out the reverse relationship (brother/sister, husband/wife)", "Choose the <b>Relationship type</b>, <b>Start date</b>, <b>Comments</b> › <b>Save</b>"], "note": "Only needed if the client has family or other related people. Add them here if they will be included in the support period.", "key": false}, {"t": "sub", "name": "Profiles", "items": ["<b>Create new profile</b> › choose the <b>Profile type</b> (e.g. intake form, initial assessment, housing application) › <b>Save</b>", "The profile form opens: fill in every field and tab shown › <b>Save</b>", "Enter the <b>Start date</b> and, when finished, the <b>End date</b> (may be called Service start, Application date, Assessment date or Close date)", "<b>May be viewed by</b>: Workgroup or Cluster"], "note": "The fields depend on the profile type set up for your team. Some profiles are added automatically for new clients. Two profiles of the same type can’t overlap.", "key": false}, {"t": "sub", "name": "Address", "items": ["<b>Create new address</b>: <b>Street</b>, <b>Suburb</b> (pick from the list), <b>State</b> (Postcode fills in), <b>Country</b>", "<b>Address type</b> (Home, Postal…), <b>Primary address?</b>, <b>Current address?</b>, <b>Comments</b>", "Tick others who <b>live at this address</b>"], "note": "Only one Primary address per person.", "key": false}, {"t": "sub", "name": "Phone &amp; other contacts", "items": ["<b>Create new econtact</b>: <b>Contact</b> (phone, mobile, email), <b>Contact type</b>", "<b>Comments</b> (e.g. “Betty – client’s mother”), <b>May be viewed by</b>", "<b>Start date</b>, <b>Current econtact?</b> › <b>Save</b>"], "note": "Emergency contacts and external workers go here too.", "key": false}, {"t": "sub", "name": "Key workers", "items": ["<b>Create new key worker</b>: choose the <b>Key worker</b> (external person: “Other, please specify”)", "<b>Role</b> (e.g. Housing support), <b>Comments</b>, <b>May be viewed by</b>", "<b>Start date</b>, <b>Current key worker?</b> › <b>Save</b>"], "note": null, "key": false}]}, {"id": "step-4", "num": "4", "title": "Open an SHS Support Period", "where": "Details tab › New Support Period", "color": "#124247", "blocks": [{"t": "p", "text": "Top of the form: tick <b>Include in PU</b> (presenting unit) for each family member being supported, check their <b>Relationship to head*</b>, and set <b>Consent</b> Yes/No (consent to send their data to the AIHW; assumed Yes). Then complete every tab and click <b>Save</b>."}, {"t": "sub", "name": "Administration", "items": ["<b>Worker</b>", "<b>Program</b> and <b>Program details</b>", "<b>Date assistance requested</b>", "<b>Date support period commenced</b> (locks once sent to the AIHW)", "<b>New client?</b> Yes / No / Don’t know", "<b>Referral source</b> and <b>Referral details</b>", "<b>May be viewed by</b>: Workgroup or Cluster"], "note": null, "key": false}, {"t": "sub", "name": "Reasons", "items": ["<b>What reasons does the client report for seeking assistance?</b> Tick every reason that applies (picked Other? type the reason)", "<b>Main presenting reason</b>: choose one"], "note": null, "key": false}, {"t": "sub", "name": "History", "items": ["<b>Homelessness</b> in the last month and last 12 months: sleeping rough / short-term or emergency accommodation / not homeless / don’t know", "<b>Last permanent address</b>: time since, state, locality, postcode", "<b>Was last permanent address where they were last week?</b> If not: state, locality, postcode", "<b>Institutions</b> in the last 12 months (hospital, psychiatric unit, disability support, rehab, adult or youth justice, immigration detention, none)"], "note": null, "key": false}, {"t": "sub", "name": "Situation", "items": ["<b>ADF member</b> (Australian Defence Force): select <b>Not applicable</b>", "<b>Does the client need help or supervision in the following areas due to a long-term health condition?</b> Select for each: <b>Self-care</b> · <b>Mobility</b> · <b>Communication</b>", "<b>NDIS package</b>: Yes / No / Don’t know", "<b>Mental health history</b>: <b>Prior mental health diagnosis</b> · <b>How long have services been received</b> · <b>Other mental health indicators</b>"], "note": null, "key": false}, {"t": "sub", "name": "Week Before", "items": ["Living arrangements", "Dwelling · Tenure", "Conditions of occupancy", "Labour force status · Employment status", "Main income source · Awaiting benefit", "Student or trainee · Enrolled in", "Child protection order"], "note": null, "key": false}, {"t": "sub", "name": "When Presenting", "items": ["The same questions as Week Before, plus <b>School enrolment</b>"], "note": "Click the copy icon to bring across the Week Before answer, then change what’s different.", "key": false}, {"t": "sub", "name": "Close", "items": ["Read-only: shows the <b>Reason for closing</b> and end date"], "note": "You close it in the Status Update (step 7).", "key": false}, {"t": "note", "text": "Only one current support period at a time. For each family member, click the <b>edit</b> icon next to their name; the <b>copy</b> icon fills their blank fields with the head’s answers. Hover over any label to see its full definition."}]}, {"id": "step-5", "num": "5", "title": "Record every contact", "where": "Notes tab › Create New Note", "color": "#647446", "blocks": [{"t": "list", "items": ["<b>Date</b> and <b>Contact type*</b> (home visit, phone, meeting, drop in, case coordination, file note…)", "<b>Worker/s*</b>: click the person icon to add a second worker or an external organisation for joint case work", "The <b>case note</b>: what happened and what support was given", "<b>Service codes</b> in the <b>Housing</b>, <b>General</b> and <b>Specialised</b> tabs: tick <b>Needs identified</b>, <b>Support provided</b> or <b>Referral arranged</b> for each service (e.g. short-term accommodation, long-term housing, help to sustain a tenancy)", "Tick <b>related people</b> this note is also for", "<b>May be viewed by</b>: Workgroup or Cluster", "<b>Contact length</b> in minutes: Contact, Case work, Travel. For a group, split the time (1 hour with 4 people = <b>15 min</b> each)", "<b>Save</b> = can still edit until the “May be edited to” date · <b>Save Final</b> = locked"]}, {"t": "note", "text": "Service codes are the only part of a note sent to the AIHW. A warning shows if the client has no open support period. Accommodation stays go in step 6."}]}, {"id": "step-6", "num": "6", "title": "Record accommodation", "where": "Accommodation tab › Create New Stay", "color": "#647446", "blocks": [{"t": "list", "items": ["<b>Accommodation start date</b>", "<b>Accommodation exit date</b>: the day they leave (one night = the next day). Leave blank if still staying.", "<b>Worker/s*</b> and <b>Type*</b> of accommodation", "<b>Notes</b>, and tick <b>related people</b> staying too", "<b>May be viewed by</b> › <b>Save</b>"]}, {"t": "note", "text": "Stays can’t overlap. Only the dates and type are sent to the AIHW."}]}, {"id": "step-7", "num": "7", "title": "Monthly SHS Status Update", "where": "Status tab › Create New Status Record", "color": "#96692D", "blocks": [{"t": "p", "text": "<b>Every month</b>, for every client with an open support period. SHIP fills in the month. Do it for each family member (edit icon)."}, {"t": "sub", "name": "Administration", "items": ["<b>Support period</b>: ongoing at end of month, or closed (support ended this month)", "A red warning means services are missing this month: fix it first"], "note": null, "key": false}, {"t": "sub", "name": "Case Plan", "items": ["<b>Case plan?</b> Yes / No", "Yes → <b>Goals achieved</b> · No → <b>Reason</b> there is no plan"], "note": null, "key": false}, {"t": "sub", "name": "Housing", "items": ["<b>Homelessness in the last month</b>", "Living arrangements · Dwelling", "Tenure · Conditions of occupancy"], "note": null, "key": false}, {"t": "sub", "name": "Work &amp; Income", "items": ["Labour force status · Employment status", "Main income source · Awaiting benefit"], "note": null, "key": false}, {"t": "sub", "name": "Study &amp; Family", "items": ["Studying? · Enrolled in · Care arrangements"], "note": null, "key": false}, {"t": "sub", "name": "Services", "items": ["Filled in from your <b>Notes</b>, <b>Payments</b> and <b>Accommodation</b>: check it is right", "Add <b>Comments</b> › <b>Save</b>"], "note": null, "key": false}, {"t": "sub", "name": "Closing the support period", "items": ["In the <b>Administration</b> tab choose <b>closed (support ended this month)</b>", "Give a <b>Reason for closing</b> › <b>Save</b>", "SHIP sets the end date to the <b>last day of service</b>", "Can’t close it? Check the <b>Services</b> tab: every month needs a service recorded"], "note": null, "key": true}, {"t": "note", "text": "The copy icon brings across last month’s answer (or the support period’s answer in the first month)."}]}, {"id": "other-tabs", "num": "", "title": "Other tabs", "where": "Persons page · use when needed", "color": "#5F292F", "blocks": [{"t": "sub", "name": "Payments", "items": ["<b>Create New Payment</b>: <b>Date</b>, <b>Worker/s*</b>", "<b>Payment for*</b> (e.g. establishing or maintaining a tenancy), <b>Amount $</b> (e.g. 90.25)", "<b>Details</b>, <b>Payee</b>, <b>Fund</b>, <b>May be viewed by</b> › <b>Save</b>"], "note": "Only Payment for and Amount are sent to the AIHW.", "key": false}, {"t": "sub", "name": "Alerts", "items": ["<b>Create New Alert</b>: <b>Date</b>, <b>Worker/s</b>, <b>Alert type*</b>", "<b>Notes</b>: describe the safety, health or other risk; tick <b>related people</b>", "<b>May be viewed by</b>, <b>Review date</b> and <b>Expiry date</b> (both needed) › <b>Save</b>"], "note": "A red icon (safety) or blue icon (other) shows next to the client’s name until the alert expires.", "key": false}, {"t": "sub", "name": "Referrals", "items": ["<b>Create New Referral</b> › <b>Referral type</b>: <b>Manual</b> (Internal / External if set up)", "<b>Service name</b>, <b>Organisation name</b>, <b>Fax</b>, <b>Email</b> › <b>Submit</b>", "<b>Restriction</b> (who can view), <b>Presenting issues</b>, <b>Additional information</b>, <b>Comments</b>", "Get the client’s <b>consent to send</b> first, then <b>Save Draft</b> or <b>Waiting</b> (sent, awaiting reply)"], "note": null, "key": false}, {"t": "sub", "name": "Plans", "items": ["<b>Create New Plan</b>: <b>Date</b>, <b>Review date</b>, <b>Description</b>", "Tick <b>related people</b>, <b>May be viewed by</b> › <b>Save</b>", "Then <b>Create New Actions</b>: one per issue, with goals, actions and outcomes"], "note": null, "key": false}, {"t": "sub", "name": "Tasks", "items": ["<b>Create New Task</b>: <b>Task date</b> (one day only), <b>Start</b>/<b>End time</b> (optional)", "<b>Worker/s</b>, <b>Task type</b>, <b>Notes</b>, tick <b>related people</b>", "<b>Send to calendar</b> Yes/No (Outlook invite)", "When done, enter the <b>Completed/Closed</b> date › <b>Save</b>"], "note": null, "key": false}, {"t": "sub", "name": "Documents", "items": ["<b>Create New Document</b>: <b>Date</b>, <b>Bring up</b> (review) date, <b>Worker/s</b>", "<b>Document type</b>: Attachment, <b>Description</b>, <b>May be viewed by</b> › <b>Save</b>", "<b>Select File…</b> › <b>Browse</b> › <b>Up Load File</b>"], "note": "One file per document record, up to 2 MB.", "key": false}, {"t": "sub", "name": "Memo", "items": ["<b>Create New Memo</b>: <b>Date</b>, <b>Worker/s</b>, <b>Memo type</b>", "Memo text in <b>Notes</b>, tick <b>related people</b>", "<b>May be viewed by</b> › <b>Save</b>"], "note": null, "key": false}]}];
const RULES=[["Black label", "= sent to the AIHW. Grey label = not sent. * = must fill."], ["One service a month:", "every open support period needs a note (not a file note), a payment or an accommodation stay each month."], ["Accommodation must match:", "the stay type in the Accommodation tab must match the Housing service ticked in the Note for that date (e.g. Medium term = Medium term)."], ["Not sure what a field means?", "Hover over its label in SHIP to see the full definition."], ["Logging in:", "username is case sensitive. Locked out after 5 wrong tries or 6 weeks without logging in."]];
const KEY='kys-ship-checklist-v1';
let ticks={};try{ticks=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ticks={}}
let mode='guide';try{mode=localStorage.getItem(KEY+'-mode')||'guide'}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ticks))}catch(e){}};
const $=s=>document.querySelector(s);
const label=s=>s.num?('Step '+s.num+' · '+s.title):s.title;
// assign ids to every tickable item
STEPS.forEach(s=>{let k=0;s.blocks.forEach(b=>{if(b.items)b.ids=b.items.map(()=>s.id+'-'+(k++))});s.total=k});
const done=s=>s.blocks.reduce((n,b)=>n+(b.ids?b.ids.filter(i=>ticks[i]).length:0),0);
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
function items(s,b){
  if(mode==='check')return '<ul class="items">'+b.items.map((t,i)=>'<li><label class="ck"><input type="checkbox" data-id="'+b.ids[i]+'"'+(ticks[b.ids[i]]?' checked':'')+'><span>'+t+'</span></label></li>').join('')+'</ul>';
  return '<ul class="items">'+b.items.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
}
function block(s,b){
  if(b.t==='p')return '<p class="p">'+b.text+'</p>';
  if(b.t==='note')return '<p class="note">'+b.text+'</p>';
  if(b.t==='list')return items(s,b);
  if(b.t==='sub')return '<div class="sub'+(b.key?' key':'')+'"><span class="tag">'+b.name+'</span>'+items(s,b)+(b.note?'<p class="note">'+b.note+'</p>':'')+'</div>';
  return '';
}
function renderNav(cur){
  $('#nav').innerHTML=STEPS.map(s=>'<a href="#'+s.id+'" style="--c:'+s.color+'"'+(s.id===cur?' aria-current="true"':'')+'><span class="chip" style="background:'+s.color+'">'+(s.num||'+')+'</span><span class="t">'+s.title+'</span>'+(mode==='check'?'<span class="c">'+done(s)+'/'+s.total+'</span>':'')+'</a>').join('');
}
function renderStep(id){
  const i=Math.max(0,STEPS.findIndex(s=>s.id===id));const s=STEPS[i];
  renderNav(s.id);
  let body='',subs=[];
  s.blocks.forEach(b=>{if(b.t==='sub')subs.push(block(s,b));else{if(subs.length){body+='<div class="subs">'+subs.join('')+'</div>';subs=[]}body+=block(s,b)}});
  if(subs.length)body+='<div class="subs">'+subs.join('')+'</div>';
  const pct=s.total?Math.round(done(s)/s.total*100):0;
  const all=STEPS.reduce((n,x)=>n+x.total,0),alld=STEPS.reduce((n,x)=>n+done(x),0);
  const bar=mode==='check'?'<div class="bar"><span class="total">'+alld+' of '+all+' items ticked</span><div><button class="btn" id="reset">Start a new client</button><span class="confirm" id="cf"><span>Clear all ticks?</span><button class="btn primary" id="yes">Yes, clear</button><button class="btn" id="no">Cancel</button></span></div></div>':'';
  const prev=STEPS[i-1],next=STEPS[i+1];
  $('#main').innerHTML=bar+'<section class="step'+(mode==='check'?' check':'')+'" style="--c:'+s.color+'"><div class="sh"><span class="chip">'+(s.num||'+')+'</span><div><h2>'+s.title+'</h2><div class="where">'+s.where+'</div></div></div>'+(mode==='check'?'<div class="prog" aria-label="'+pct+'% done"><i style="width:'+pct+'%"></i></div>':'')+body+'</section><div class="pager">'+(prev?'<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="#'+prev.id+'">← '+label(prev)+'</a>':'<span></span>')+(next?'<a class="btn primary" style="display:inline-flex;align-items:center;text-decoration:none" href="#'+next.id+'">'+label(next)+' →</a>':'')+'</div>'+'<p class="foot">Based on the SHIP User Guide (July 2011) and current KYS practice. Ticks are saved only in this browser and hold no client details.</p>';
  if(mode==='check'){
    $('#reset').onclick=()=>{$('#cf').classList.add('on');$('#reset').style.display='none'};
    $('#no').onclick=()=>renderStep(s.id);
    $('#yes').onclick=()=>{ticks={};save();renderStep(s.id)};
  }
}
function rulesHtml(){return '<summary><h2>Rules to remember</h2></summary>'+RULES.map(r=>'<p><b>'+r[0]+'</b> '+r[1]+'</p>').join('')}
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderSearch(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  STEPS.forEach(s=>s.blocks.forEach(b=>{
    const texts=b.items?b.items:[b.text];
    texts.forEach(t=>{const pt=plain(t);const low=(pt+' '+(b.name||'')+' '+s.title).toLowerCase();if(words.every(w=>low.includes(w)))hits.push({s,where:b.name||'',text:pt})});
  }));
  renderNav('');
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  $('#main').innerHTML='<h2 style="font-size:28px">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(q)+'”</h2>'+(hits.length?'<div class="res">'+hits.slice(0,60).map(h=>'<button class="hit" style="--c:'+h.s.color+'" data-go="'+h.s.id+'"><small>'+esc(label(h.s))+(h.where?' › '+esc(h.where):'')+'</small>'+esc(h.text).replace(re,'<mark>$1</mark>')+'</button>').join('')+'</div>':'<div class="empty">Nothing matches. Try another word, such as “address”, “consent” or “closing”.</div>');
}
function route(){const q=$('#q').value.trim();if(q.length>1)return renderSearch(q);renderStep((location.hash||'').slice(1)||STEPS[0].id)}
function setMode(m){mode=m;try{localStorage.setItem(KEY+'-mode',m)}catch(e){}$('#mGuide').setAttribute('aria-pressed',m==='guide');$('#mCheck').setAttribute('aria-pressed',m==='check');route()}
$('#rules').innerHTML=rulesHtml();
$('#mGuide').onclick=()=>setMode('guide');$('#mCheck').onclick=()=>setMode('check');
$('#q').addEventListener('input',route);
$('#main').addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;if(e.target.checked)ticks[id]=1;else delete ticks[id];save();const cur=(location.hash||'').slice(1)||STEPS[0].id;const y=window.scrollY;renderStep(cur);window.scrollTo(0,y)});
$('#main').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){$('#q').value='';location.hash=g.dataset.go;route();window.scrollTo(0,0)}});
window.addEventListener('hashchange',()=>{if(!$('#q').value.trim())route();window.scrollTo(0,0)});
setMode(mode);
}
</script>
</body>
